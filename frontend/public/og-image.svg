<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f44"/>
      <stop offset="0.55" stop-color="#13316d"/>
      <stop offset="1" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#34a853"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 斜向网格纹理 -->
  <g fill="#ffffff" fill-opacity="0.04">
    <rect x="0" y="0" width="1200" height="2"/>
    <rect x="0" y="160" width="1200" height="2"/>
    <rect x="0" y="320" width="1200" height="2"/>
    <rect x="0" y="480" width="1200" height="2"/>
  </g>
  <!-- logo 徽标 -->
  <rect x="96" y="96" width="120" height="120" rx="26" fill="#ffffff" fill-opacity="0.12"/>
  <text x="156" y="186" font-size="86" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif">▦</text>
  <!-- 站点名 -->
  <text x="248" y="150" font-size="40" fill="#bcd3ff" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700">example.com</text>
  <text x="248" y="205" font-size="26" fill="#7fa8e8" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">生死狙击 · 实时排行榜与玩家查询</text>
  <!-- 主标题 -->
  <text x="96" y="358" font-size="96" fill="#ffffff" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="800">氪佬修仙 · 排行榜</text>
  <!-- 副标题 / 功能 -->
  <text x="100" y="436" font-size="34" fill="#e3ecfb" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">战力榜 · 经验榜 · 天梯榜 · 战队榜 · 分区榜</text>
  <text x="100" y="486" font-size="34" fill="#e3ecfb" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">玩家查询 · 武器库 · 活动通知 · 全站开放 API</text>
  <!-- 底部强调条 -->
  <rect x="96" y="540" width="560" height="10" rx="5" fill="url(#accent)"/>
  <text x="96" y="592" font-size="26" fill="#9db8e6" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">永久免费 · 公益 · 离线可用</text>
</svg>
