# nginx 站点配置：example.com（SSR 架构）
#   页面流量  → Next.js SSR（127.0.0.1:3000，strikegod-web 容器）
#   /api/**   → Spring Boot（127.0.0.1:8080，strikegod 容器）
# 宝塔面板：站点 → 配置文件，对照 location 部分粘贴即可（SSL 段由面板管理）。
server {
    listen 80;
    server_name example.com www.example.com;

    client_max_body_size 16m;

    # 榜单读 API：缓存 + 后端重启时回退上次缓存（部署/重启不中断数据）
    location ~ ^/api/public/(boards|board|servers|tab|slice|weapon|marquee|visit|geo) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache strikegod_com_cache;
        proxy_cache_valid 200 15s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
    }

    # 其它 API（玩家查询/鉴权/后台写）：直连后端，不缓存
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # 账号/验证页面：绝不缓存，避免旧注册表单被浏览器/Cloudflare/SW 留住
    location ~ ^/(register|login|account|forgot|reset|verify)/?$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Service Worker 不缓存（保证版本更新及时）
    location = /sw.js {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $http_host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # QQ 机器人内部端点（/qqbot/push 活动推送、/qqbot/event NapCat 事件回调）：仅供本机
    # NapCat/Spring 直连 127.0.0.1:3100 调用，公网一律拦掉（避免外部伪造触发推送/状态回执）。
    location ^~ /qqbot/ {
        return 404;
    }

    # 页面（SSR）+ _next/static（Next 自带 immutable 缓存头）+ public 资产
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        # SSR HTML 绝不经 nginx 缓存：宝塔有全局 proxy_cache(cache_one)，未显式关掉会被 location/ 继承，
        # 按上游 s-maxage 把页面 HTML 缓存住；重新部署后 chunk 哈希轮换，旧 HTML 引用已删 chunk → 整页白板。
        # _next/static 由浏览器/CF 凭 immutable 头缓存，无需 nginx 再缓存。
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
